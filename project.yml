name: Logos
options:
  bundleIdPrefix: com.anky
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: 84V63LKV45
    CODE_SIGN_STYLE: Automatic
packages:
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    exactVersion: 144.7559.11
targets:
  Logos:
    type: application
    platform: iOS
    sources:
      - path: TenorPractice
    dependencies:
      - package: LiveKitWebRTC
    configFiles:
      Debug: Config/Development.xcconfig
      Release: Config/Development.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anky.logos
        PRODUCT_NAME: Logos
        PRODUCT_MODULE_NAME: Logos
        INFOPLIST_KEY_CFBundleDisplayName: "Logos"
        INFOPLIST_KEY_CFBundleName: "Logos"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 84V63LKV45
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: TenorPractice/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Logos"
        CFBundleName: "Logos"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Logos uses your microphone so you can practice a live conversation.
        NSCameraUsageDescription: Logos does not use your camera. This entry is required by the real-time audio framework that powers live conversations.
        OpenAIAPIKey: $(OPENAI_API_KEY)
        OpenAIRealtimeModel: $(OPENAI_REALTIME_MODEL)
        OpenAIRealtimeVoice: $(OPENAI_REALTIME_VOICE)
        OpenAIEvaluationModel: $(OPENAI_EVALUATION_MODEL)
        OpenAISpeechModel: $(OPENAI_SPEECH_MODEL)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  LogosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TenorPracticeTests
    dependencies:
      - target: Logos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anky.logos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Logos.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Logos"
schemes:
  Logos:
    build:
      targets:
        Logos: all
        LogosTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LogosTests
    archive:
      config: Release
